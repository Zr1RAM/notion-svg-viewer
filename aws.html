  </div>

  <script>
    (function () {
      const wrapper = document.getElementById("wrapper");
      const elem = wrapper ? wrapper.querySelector("svg") : null;
      if (!elem || !wrapper) return;

      let scale = 1;
      let pointX = 0;
      let pointY = 0;
      let start = { x: 0, y: 0 };
      let isPanning = false;

      function update() {
        elem.style.transformOrigin = "0 0";
        elem.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
      }

      wrapper.addEventListener("mousedown", (e) => {
        e.preventDefault();
        start = { x: e.clientX - pointX, y: e.clientY - pointY };
        isPanning = true;
      });

      window.addEventListener("mouseup", () => {
        isPanning = false;
      });

      window.addEventListener("mousemove", (e) => {
        if (!isPanning) return;
        pointX = e.clientX - start.x;
        pointY = e.clientY - start.y;
        update();
      });

      wrapper.addEventListener("wheel", (e) => {
        e.preventDefault();
        const xs = (e.clientX - pointX) / scale;
        const ys = (e.clientY - pointY) / scale;
        const factor = e.deltaY < 0 ? 1.15 : 0.85;
        const nextScale = Math.min(Math.max(0.1, scale * factor), 15);

        pointX = e.clientX - xs * nextScale;
        pointY = e.clientY - ys * nextScale;
        scale = nextScale;
        update();
      }, { passive: false });

      update();
    })();
  </script>
