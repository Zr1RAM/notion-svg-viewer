<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cloud Architecture Hub</title>
  <style>
    body {
      background: #121212;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h2 { margin-bottom: 20px; }
    .menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 280px;
    }
    a {
      background: #1e1e1e;
      color: #00ff88;
      padding: 14px 20px;
      text-decoration: none;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      border: 1px solid #333;
      transition: background 0.2s;
    }
    a:hover {
      background: #282828;
    }
    .loading { color: #888; font-size: 14px; }
  </style>
</head>
<body>

  <h2>Cloud Architecture Hub</h2>
  <div id="menu" class="menu">
    <span class="loading">Loading diagrams...</span>
  </div>

  <script>
    const USERNAME = "Zr1RAM";
    const REPO = "notion-svg-viewer";
    
    async function loadDiagrams() {
      const menuContainer = document.getElementById("menu");
      try {
        const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/`);
        const files = await response.json();
        
        // Clear loading text
        menuContainer.innerHTML = "";

        // Filter for .html files, excluding index.html itself
        const htmlFiles = files.filter(file => file.name.endsWith(".html") && file.name !== "index.html");

        if (htmlFiles.length === 0) {
          menuContainer.innerHTML = `<span class="loading">No diagrams found yet.</span>`;
          return;
        }

        htmlFiles.forEach(file => {
          // Format filename nicely for display (e.g., "aws-networking.html" -> "Aws Networking")
          let title = file.name.replace(".html", "").replace(/-/g, " ");
          title = title.charAt(0).toUpperCase() + title.slice(1);

          const link = document.createElement("a");
          link.href = file.download_url.replace("raw.githubusercontent.com", "yourusername.github.io").replace(`/${REPO}/main/`, `/${REPO}/`); // points to the live page URL
          link.href = file.name; // relative link to the file on GitHub Pages
          link.innerText = title;
          
          menuContainer.appendChild(link);
        });
      } catch (err) {
        menuContainer.innerHTML = `<span class="loading" style="color:#ff4444;">Failed to load directory.</span>`;
      }
    }

    loadDiagrams();
  </script>

</body>
</html>
