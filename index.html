<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Diagrams Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0f1117;
      --bg-card: #181b22;
      --bg-card-hover: #1f242e;
      --bg-subcard: #13161c;
      --bg-subcard-hover: #1c212b;
      --border-color: #272d3b;
      --border-hover: #3d465c;
      --text-primary: #f0f3f6;
      --text-secondary: #949eb2;
      --text-muted: #5e687e;
      --accent-green: #00ff88;
      --accent-glow: rgba(0, 255, 136, 0.15);
      --accent-blue: #38bdf8;
      --accent-purple: #a855f7;
      --card-radius: 14px;
      --btn-radius: 10px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }

    /* Custom Webkit Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      transition: background 0.2s;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      line-height: 1.5;
    }

    /* Background Ambient Glow */
    .ambient-glow {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 380px;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.08) 0%, rgba(56, 189, 248, 0.04) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 36px;
    }

    .badge-hub {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 255, 136, 0.1);
      color: var(--accent-green);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 136, 0.25);
      margin-bottom: 14px;
    }

    .badge-hub svg {
      width: 13px;
      height: 13px;
    }

    h1 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: var(--text-secondary);
      font-size: 15px;
      max-width: 520px;
      margin: 0 auto;
    }

    /* Controls / Search bar */
    .controls-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      gap: 12px;
      margin-bottom: 36px;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
    }

    .search-wrapper svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      fill: var(--text-muted);
      pointer-events: none;
      transition: var(--transition);
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--btn-radius);
      padding: 12px 16px 12px 42px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--accent-green);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-input:focus + svg {
      fill: var(--accent-green);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    /* Folders Masonry Layout (Eliminates rigid row track gaps) */
    .folders-grid {
      display: flex;
      gap: 20px;
      width: 100%;
      align-items: flex-start;
    }

    .grid-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 0;
    }

    @media (max-width: 768px) {
      .folders-grid {
        flex-direction: column;
      }
    }

    /* Folder Card */
    .folder-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      overflow: hidden;
      transition: var(--transition);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      width: 100%;
    }

    .folder-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .folder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      cursor: pointer;
      user-select: none;
      background: var(--bg-card);
      transition: background 0.2s;
    }

    .folder-header:hover {
      background: var(--bg-card-hover);
    }

    .folder-title-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .folder-icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: var(--transition);
    }

    .folder-card.open .folder-icon {
      background: rgba(0, 255, 136, 0.12);
      border-color: rgba(0, 255, 136, 0.3);
      color: var(--accent-green);
    }

    .folder-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .folder-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .folder-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-count {
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .folder-toggle-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .folder-toggle-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .folder-card.open .folder-toggle-btn svg {
      transform: rotate(180deg);
      color: var(--accent-green);
    }

    /* Submenu (collapsible drawer) */
    .folder-submenu {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s cubic-bezier(0.16, 1, 0.3, 1), padding 0.3s;
      background: var(--bg-subcard);
      border-top: 1px solid transparent;
    }

    .folder-card.open .folder-submenu {
      grid-template-rows: 1fr;
      border-top-color: var(--border-color);
    }

    .submenu-content {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 16px;
      transition: padding 0.3s;
    }

    .folder-card.open .submenu-content {
      padding: 14px 16px 18px;
    }

    /* Diagram Link Button */
    .diagram-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--btn-radius);
      padding: 12px 14px;
      text-decoration: none;
      color: var(--text-primary);
      transition: var(--transition);
    }

    .diagram-btn:hover {
      background: var(--bg-subcard-hover);
      border-color: var(--accent-green);
      transform: translateX(3px);
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    .diagram-btn-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .diagram-btn-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .diagram-btn:hover .diagram-btn-icon {
      background: rgba(0, 255, 136, 0.15);
      color: var(--accent-green);
    }

    .diagram-btn-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .diagram-btn-arrow {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      transition: var(--transition);
    }

    .diagram-btn:hover .diagram-btn-arrow {
      color: var(--accent-green);
      transform: translateX(3px);
    }

    .diagram-btn-arrow svg {
      width: 16px;
      height: 16px;
    }

    .diagram-btn.is-markdown:hover {
      border-color: var(--accent-purple);
      box-shadow: 0 2px 12px rgba(168, 85, 247, 0.2);
    }

    .diagram-btn.is-markdown .diagram-btn-icon {
      background: rgba(168, 85, 247, 0.12);
      color: var(--accent-purple);
      border: 1px solid rgba(168, 85, 247, 0.25);
    }

    .diagram-btn.is-markdown:hover .diagram-btn-icon {
      background: rgba(168, 85, 247, 0.25);
      color: #d8b4fe;
    }

    .diagram-btn.is-markdown:hover .diagram-btn-arrow {
      color: var(--accent-purple);
    }

    .item-type-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      display: inline-block;
      vertical-align: middle;
    }

    .pill-html {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .pill-md {
      background: rgba(168, 85, 247, 0.12);
      color: var(--accent-purple);
      border: 1px solid rgba(168, 85, 247, 0.25);
    }

    /* Nested Subfolder Accordion */
    .subfolder-group {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 8px;
      transition: var(--transition);
    }

    .subfolder-group:last-child {
      margin-bottom: 0;
    }

    .subfolder-group:hover {
      border-color: rgba(168, 85, 247, 0.35);
    }

    .subfolder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      cursor: pointer;
      user-select: none;
      background: var(--bg-card);
      transition: background 0.2s;
    }

    .subfolder-header:hover {
      background: var(--bg-subcard-hover);
    }

    .subfolder-title-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subfolder-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: rgba(168, 85, 247, 0.12);
      color: var(--accent-purple);
      border: 1px solid rgba(168, 85, 247, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .subfolder-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .subfolder-badge {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 7px;
      border-radius: 8px;
    }

    .subfolder-toggle-btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .subfolder-toggle-btn svg {
      width: 15px;
      height: 15px;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .subfolder-group.open .subfolder-toggle-btn svg {
      transform: rotate(180deg);
      color: var(--accent-purple);
    }

    .subfolder-drawer {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      background: var(--bg-subcard);
      border-top: 1px solid transparent;
    }

    .subfolder-group.open .subfolder-drawer {
      grid-template-rows: 1fr;
      border-top-color: var(--border-color);
    }

    .subfolder-items {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 0 12px;
      transition: padding 0.25s;
    }

    .subfolder-group.open .subfolder-items {
      padding: 10px 12px 14px;
    }

    .badge-env {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-secondary);
      text-decoration: none;
      transition: var(--transition);
      user-select: none;
    }
    .badge-env.local {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-blue);
      border-color: rgba(56, 189, 248, 0.3);
    }
    .badge-env.local:hover {
      background: rgba(56, 189, 248, 0.18);
    }
    .badge-env.github {
      background: rgba(0, 255, 136, 0.1);
      color: var(--accent-green);
      border-color: rgba(0, 255, 136, 0.3);
    }
    .badge-env .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Empty state / Loading */
    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
      font-size: 15px;
    }

    .status-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Local Manifest Script (Enables direct offline file:/// execution without CORS) -->
  <script src="diagrams.js"></script>
</head>

<body>

  <div class="ambient-glow"></div>

  <div class="container">
    <header>
      <div style="display:flex; justify-content:center; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap;">
        <div class="badge-hub">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          Diagrams & Knowledge Hub
        </div>
        <div id="env-badge" class="badge-env" title="Loading environment mode...">
          <span class="status-dot"></span> Checking Mode...
        </div>
      </div>
      <h1>Notion Diagrams & Docs Hub</h1>
      <p class="subtitle">Select a category folder below to view architecture diagrams with interactive sidebars, or read comprehensive study guides and interview preps.</p>
    </header>

    <div class="controls-bar">
      <div class="search-wrapper">
        <input type="text" id="search-input" class="search-input" placeholder="Search categories or diagrams (e.g. AWS, Cloud)..." autocomplete="off">
        <svg viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </div>
    </div>

    <!-- Dynamic Folders Grid -->
    <div id="folders-grid" class="folders-grid">
      <div class="status-msg">
        <div class="status-spinner"></div>
        Discovering diagram paths...
      </div>
    </div>
  </div>

  <script>
    // GitHub repository config for online fallback and automated discovery
    const GITHUB_USER = "Zr1RAM";
    const GITHUB_REPO = "notion-svg-viewer";

    // Known acronyms to format cleanly in uppercase
    const ACRONYMS = new Set(["AWS", "GCP", "AZURE", "API", "DB", "K8S", "CI", "CD", "DNS", "CDN", "IAM", "VPC", "DSA", "SQL"]);

    /**
     * Converts a folder slug like "cloud-architecture" to "Cloud Architecture"
     */
    function formatFolderName(slug) {
      if (!slug || slug === "root") return "General Diagrams";
      return slug
        .replace(/[-_]/g, " ")
        .split(" ")
        .filter(Boolean)
        .map(word => {
          if (word === "&") return "&";
          const upper = word.toUpperCase();
          if (ACRONYMS.has(upper)) return upper;
          return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
        })
        .join(" ");
    }

    /**
     * Converts a filename like "aws.html" or "Interiview_Prep_1.md" to a clean title
     */
    function formatDiagramTitle(filename) {
      let base = filename.replace(/\.(html|md)$/i, "");
      if (base.toLowerCase() === "readme") return "Overview & Index";
      return base
        .replace(/([a-z])([A-Z])/g, "$1 $2")
        .replace(/Interiview/gi, "Interview")
        .replace(/[-_]/g, " ")
        .split(" ")
        .filter(Boolean)
        .map(word => {
          if (word === "&") return "&";
          const upper = word.toUpperCase();
          if (ACRONYMS.has(upper)) return upper;
          return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
        })
        .join(" ");
    }

    // Centralized set of AI and LLM instruction files to exclude from the hub directory
    const IGNORED_AI_FILENAMES = new Set([
      "agents.md",
      "agent.md",
      "skills.md",
      "skill.md",
      "claude.md",
      "gemini.md",
      "copilot-instructions.md",
      "prompt.md",
      "prompts.md",
      "license.md",
      "license.txt",
      "contributing.md",
      "code_of_conduct.md",
      "security.md",
      "changelog.md"
    ]);

    // Directories to exclude from hub navigation (hidden config, AI tools, dependencies)
    const IGNORED_DIRECTORY_KEYWORDS = [
      "/.agents/",
      "/.gemini/",
      "/.github/",
      "/.vscode/",
      "/.idea/",
      "/skills/",
      "/agents/",
      "/prompts/",
      "/plugins/",
      "/node_modules/"
    ];

    /**
     * Determines whether a file path should be excluded from the hub menu.
     * Automatically filters out AI agent prompts, system infrastructure, and dotfiles.
     */
    function isIgnoredPath(rawPath) {
      if (!rawPath) return true;
      const normalized = ("/" + rawPath.replace(/\\/g, "/").trim()).replace(/\/+/g, "/").toLowerCase();
      const fileName = normalized.split("/").pop();

      // 1. Only allow .html and .md files
      if (!fileName.endsWith(".html") && !fileName.endsWith(".md")) {
        return true;
      }

      // 2. Ignore hidden files and dot-folders (.agents, .github, etc.)
      if (normalized.includes("/.")) {
        return true;
      }

      // 3. Ignore root repository application files and root readme
      if (normalized === "/readme.md" || normalized === "/index.html" || normalized === "/viewer.html") {
        return true;
      }

      // 4. Ignore AI agent, skill, and LLM guideline files anywhere in the repo
      if (IGNORED_AI_FILENAMES.has(fileName)) {
        return true;
      }

      // 5. Ignore AI / system directories
      if (IGNORED_DIRECTORY_KEYWORDS.some(kw => normalized.includes(kw))) {
        return true;
      }

      return false;
    }

    /**
     * Parses relative paths into root categories with nested subfolders.
     * Example: "Interview Prep/React & Node/Interiview_Prep_1.md"
     * -> Root Category: "Interview Prep"
     * -> Subfolder: "React & Node"
     * -> Item: "Interview Prep 1"
     */
    function groupPathsByFolder(paths) {
      const folderMap = new Map();

      paths.forEach(rawPath => {
        if (isIgnoredPath(rawPath)) {
          return;
        }

        // Normalize slashes
        const normalized = rawPath.replace(/\\/g, "/").trim();
        const lower = normalized.toLowerCase();

        const isMarkdown = lower.endsWith(".md");
        const segments = normalized.split("/");
        
        let rootSlug = "general";
        let subfolderSlug = null;
        let fileName = "";

        if (segments.length === 1) {
          rootSlug = "general";
          fileName = segments[0];
        } else if (segments.length === 2) {
          rootSlug = segments[0];
          fileName = segments[1];
        } else {
          // 3 or more segments: Root Folder / Subfolder / File
          rootSlug = segments[0];
          subfolderSlug = segments.slice(1, -1).join("/");
          fileName = segments[segments.length - 1];
        }

        if (!folderMap.has(rootSlug)) {
          folderMap.set(rootSlug, {
            slug: rootSlug,
            name: formatFolderName(rootSlug),
            directItems: [],
            subfolders: new Map()
          });
        }

        const item = {
          title: formatDiagramTitle(fileName),
          fileName: fileName,
          path: normalized,
          isMarkdown: isMarkdown,
          href: isMarkdown ? `viewer.html?file=${encodeURIComponent(normalized)}` : encodeURI(normalized)
        };

        const rootFolder = folderMap.get(rootSlug);
        if (subfolderSlug) {
          if (!rootFolder.subfolders.has(subfolderSlug)) {
            rootFolder.subfolders.set(subfolderSlug, {
              slug: subfolderSlug,
              name: formatFolderName(subfolderSlug),
              items: []
            });
          }
          rootFolder.subfolders.get(subfolderSlug).items.push(item);
        } else {
          rootFolder.directItems.push(item);
        }
      });

      // Sort items inside each folder and subfolder (README first, then alphabetically)
      const sortFn = (a, b) => {
        if (a.fileName.toLowerCase().startsWith("readme")) return -1;
        if (b.fileName.toLowerCase().startsWith("readme")) return 1;
        return a.title.localeCompare(b.title);
      };

      const result = [];
      folderMap.forEach(folder => {
        folder.directItems.sort(sortFn);

        const subfolderList = Array.from(folder.subfolders.values()).map(sf => {
          sf.items.sort(sortFn);
          return sf;
        });

        // Sort subfolders alphabetically
        subfolderList.sort((a, b) => a.name.localeCompare(b.name));

        const totalItems = folder.directItems.length + subfolderList.reduce((acc, sf) => acc + sf.items.length, 0);

        result.push({
          slug: folder.slug,
          name: folder.name,
          directItems: folder.directItems,
          subfolders: subfolderList,
          totalCount: totalItems
        });
      });

      // Sort root folders alphabetically
      result.sort((a, b) => a.name.localeCompare(b.name));
      return result;
    }

    /**
     * Renders an individual diagram or markdown document button
     */
    function renderDiagramItem(diagram) {
      return `
        <a href="${diagram.href}" class="diagram-btn ${diagram.isMarkdown ? 'is-markdown' : ''}">
          <div class="diagram-btn-left">
            <div class="diagram-btn-icon">${diagram.isMarkdown ? 'MD' : diagram.title.slice(0, 3)}</div>
            <div>
              <span class="diagram-btn-title">${diagram.title}</span>
              <span class="item-type-pill ${diagram.isMarkdown ? 'pill-md' : 'pill-html'}">${diagram.isMarkdown ? 'DOC' : 'HTML'}</span>
            </div>
          </div>
          <div class="diagram-btn-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </div>
        </a>
      `;
    }

    /**
     * Renders the folder cards, collapsible submenus, and nested subfolders
     */
    let currentFolders = [];

    function renderGrid(folders) {
      const gridContainer = document.getElementById("folders-grid");
      const searchQuery = (document.getElementById("search-input").value || "").trim().toLowerCase();

      gridContainer.innerHTML = "";

      // Filter based on search query
      const filteredFolders = folders.map(folder => {
        const rootMatches = folder.name.toLowerCase().includes(searchQuery);

        // Filter direct items
        const matchedDirect = folder.directItems.filter(d => 
          rootMatches || d.title.toLowerCase().includes(searchQuery) || d.fileName.toLowerCase().includes(searchQuery)
        );

        // Filter subfolders and their nested items
        const matchedSubfolders = folder.subfolders.map(sf => {
          const sfMatches = rootMatches || sf.name.toLowerCase().includes(searchQuery);
          const matchedSfItems = sf.items.filter(d =>
            sfMatches || d.title.toLowerCase().includes(searchQuery) || d.fileName.toLowerCase().includes(searchQuery)
          );

          if (matchedSfItems.length > 0) {
            return {
              ...sf,
              items: matchedSfItems,
              shouldOpen: true
            };
          }
          return null;
        }).filter(Boolean);

        const totalMatched = matchedDirect.length + matchedSubfolders.reduce((acc, sf) => acc + sf.items.length, 0);

        if (totalMatched > 0) {
          return {
            ...folder,
            directItems: matchedDirect,
            subfolders: matchedSubfolders,
            totalCount: totalMatched,
            shouldOpen: searchQuery.length > 0
          };
        }
        return null;
      }).filter(Boolean);

      if (filteredFolders.length === 0) {
        gridContainer.innerHTML = `
          <div class="status-msg">
            No diagrams or folders match "${searchQuery}".
          </div>
        `;
        return;
      }

      // Responsive column distribution (prevents empty row gaps across columns)
      const numCols = window.innerWidth <= 768 ? 1 : 2;
      const colContainers = [];
      for (let c = 0; c < numCols; c++) {
        const col = document.createElement("div");
        col.className = "grid-column";
        gridContainer.appendChild(col);
        colContainers.push(col);
      }

      filteredFolders.forEach((folder, idx) => {
        const card = document.createElement("div");
        card.className = `folder-card ${folder.shouldOpen || idx === 0 ? "open" : ""}`;
        card.id = `folder-${folder.slug.replace(/[^a-zA-Z0-9]/g, "-")}`;

        card.innerHTML = `
          <div class="folder-header" role="button" tabindex="0" aria-expanded="${folder.shouldOpen || idx === 0}">
            <div class="folder-title-area">
              <div class="folder-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
              </div>
              <div class="folder-info">
                <div class="folder-name">${folder.name}</div>
                <div class="folder-meta">
                  <span class="badge-count">${folder.totalCount} ${folder.totalCount === 1 ? 'item' : 'items'}</span>
                  <span>•</span>
                  <span>/${folder.slug}</span>
                </div>
              </div>
            </div>
            <div class="folder-toggle-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>

          <div class="folder-submenu">
            <div class="submenu-content">
              ${folder.directItems.map(renderDiagramItem).join("")}

              ${folder.subfolders.map(sf => `
                <div class="subfolder-group ${sf.shouldOpen !== false ? 'open' : ''}">
                  <div class="subfolder-header" role="button" tabindex="0" aria-expanded="${sf.shouldOpen !== false}">
                    <div class="subfolder-title-area">
                      <div class="subfolder-icon">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                        </svg>
                      </div>
                      <span class="subfolder-name">${sf.name}</span>
                      <span class="subfolder-badge">${sf.items.length} ${sf.items.length === 1 ? 'item' : 'items'}</span>
                    </div>
                    <div class="subfolder-toggle-btn">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                      </svg>
                    </div>
                  </div>
                  <div class="subfolder-drawer">
                    <div class="subfolder-items">
                      ${sf.items.map(renderDiagramItem).join("")}
                    </div>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        `;

        // Subfolder accordion toggle handlers
        card.querySelectorAll(".subfolder-group").forEach(subGroup => {
          const subHeader = subGroup.querySelector(".subfolder-header");
          const toggleSub = (e) => {
            e.stopPropagation();
            const isOpen = subGroup.classList.toggle("open");
            subHeader.setAttribute("aria-expanded", isOpen);
          };
          subHeader.addEventListener("click", toggleSub);
          subHeader.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              toggleSub(e);
            }
          });
        });

        // Parent card toggle handler
        const header = card.querySelector(".folder-header");
        const toggle = () => {
          const isOpen = card.classList.toggle("open");
          header.setAttribute("aria-expanded", isOpen);
        };

        header.addEventListener("click", toggle);
        header.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });

        // Distribute card into its column track
        colContainers[idx % numCols].appendChild(card);
      });
    }

    /**
     * Dynamically discovers paths from local manifest (diagrams.js/diagrams.json)
     * and GitHub tree API when available.
     */
    async function loadDiagramPaths() {
      const pathsSet = new Set();

      // 1. Read from window.DIAGRAM_PATHS (loaded instantly from diagrams.js with ZERO CORS issues locally)
      if (Array.isArray(window.DIAGRAM_PATHS) && window.DIAGRAM_PATHS.length > 0) {
        window.DIAGRAM_PATHS.forEach(p => pathsSet.add(p));
      }

      // 2. Try fetching diagrams.json if running on a local web server (http/https)
      if (window.location.protocol.startsWith("http")) {
        try {
          const resp = await fetch("diagrams.json");
          if (resp.ok) {
            const jsonPaths = await resp.json();
            if (Array.isArray(jsonPaths)) {
              jsonPaths.forEach(p => pathsSet.add(p));
            }
          }
        } catch (e) {
          // Fall through to GitHub API
        }
      }

      // Initial render with all discovered paths so far
      if (pathsSet.size > 0) {
        currentFolders = groupPathsByFolder(Array.from(pathsSet));
        renderGrid(currentFolders);
      }

      // 3. Online dynamic discovery vs Local Mode
      const urlParams = new URLSearchParams(window.location.search);
      const forceSource = urlParams.get("source"); // 'local' | 'github'
      const isLocalHost = window.location.protocol === "file:" || 
                          window.location.hostname === "localhost" || 
                          window.location.hostname === "127.0.0.1";
      const isLocalMode = forceSource === "local" || (isLocalHost && forceSource !== "github");

      // Update Header Environment Badge
      const envBadge = document.getElementById("env-badge");
      if (envBadge) {
        if (isLocalMode) {
          envBadge.className = "badge-env local";
          envBadge.innerHTML = `<span class="status-dot"></span> Local Mode (diagrams.js)`;
          envBadge.title = "Local Testing: Loading local manifests. Click to simulate GitHub Tree API.";
          envBadge.style.cursor = "pointer";
          envBadge.onclick = () => {
            const next = forceSource === "github" ? "" : "?source=github";
            window.location.search = next;
          };
        } else {
          envBadge.className = "badge-env github";
          envBadge.innerHTML = `<span class="status-dot"></span> GitHub Pages (Live API)`;
          envBadge.title = isLocalHost ? "Simulating GitHub API locally. Click to return to local manifests." : "Deployed Mode: Querying GitHub Trees API.";
          if (isLocalHost) {
            envBadge.style.cursor = "pointer";
            envBadge.onclick = () => { window.location.search = ""; };
          }
        }
      }

      // If in GitHub mode, query the recursive tree API
      if (!isLocalMode || pathsSet.size === 0) {
        try {
          const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/main?recursive=1`;
          const res = await fetch(apiUrl);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data.tree)) {
              let foundNew = false;
              data.tree.forEach(item => {
                if (item.type === "blob" && !isIgnoredPath(item.path)) {
                  if (!pathsSet.has(item.path)) {
                    pathsSet.add(item.path);
                    foundNew = true;
                  }
                }
              });

              if (foundNew || currentFolders.length === 0) {
                currentFolders = groupPathsByFolder(Array.from(pathsSet));
                renderGrid(currentFolders);
              }
            }
          }
        } catch (err) {
          // Offline / network failure handled gracefully
        }
      }

      // Fallback if completely empty
      if (pathsSet.size === 0) {
        document.getElementById("folders-grid").innerHTML = `
          <div class="status-msg">
            No diagram paths detected.<br>
            Please check that <code>diagrams.js</code> exists or diagram HTML files are placed in subfolders.
          </div>
        `;
      }
    }

    // Attach search input listener
    document.getElementById("search-input").addEventListener("input", () => {
      renderGrid(currentFolders);
    });

    // Re-layout on screen resize (between 1-col mobile and 2-col desktop)
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        renderGrid(currentFolders);
      }, 150);
    });

    // Start discovery
    loadDiagramPaths();
  </script>
