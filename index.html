<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Diagrams Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0f1117;
      --bg-card: #181b22;
      --bg-card-hover: #1f242e;
      --bg-subcard: #13161c;
      --bg-subcard-hover: #1c212b;
      --border-color: #272d3b;
      --border-hover: #3d465c;
      --text-primary: #f0f3f6;
      --text-secondary: #949eb2;
      --text-muted: #5e687e;
      --accent-green: #00ff88;
      --accent-glow: rgba(0, 255, 136, 0.15);
      --accent-blue: #38bdf8;
      --accent-purple: #a855f7;
      --card-radius: 14px;
      --btn-radius: 10px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      line-height: 1.5;
    }

    /* Background Ambient Glow */
    .ambient-glow {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 380px;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.08) 0%, rgba(56, 189, 248, 0.04) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 36px;
    }

    .badge-hub {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 255, 136, 0.1);
      color: var(--accent-green);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 136, 0.25);
      margin-bottom: 14px;
    }

    .badge-hub svg {
      width: 13px;
      height: 13px;
    }

    h1 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: var(--text-secondary);
      font-size: 15px;
      max-width: 520px;
      margin: 0 auto;
    }

    /* Controls / Search bar */
    .controls-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      gap: 12px;
      margin-bottom: 36px;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
    }

    .search-wrapper svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      fill: var(--text-muted);
      pointer-events: none;
      transition: var(--transition);
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--btn-radius);
      padding: 12px 16px 12px 42px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--accent-green);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-input:focus + svg {
      fill: var(--accent-green);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    /* Folders Grid */
    .folders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
      width: 100%;
    }

    @media (max-width: 640px) {
      .folders-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Folder Card */
    .folder-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      overflow: hidden;
      transition: var(--transition);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .folder-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .folder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      cursor: pointer;
      user-select: none;
      background: var(--bg-card);
      transition: background 0.2s;
    }

    .folder-header:hover {
      background: var(--bg-card-hover);
    }

    .folder-title-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .folder-icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: var(--transition);
    }

    .folder-card.open .folder-icon {
      background: rgba(0, 255, 136, 0.12);
      border-color: rgba(0, 255, 136, 0.3);
      color: var(--accent-green);
    }

    .folder-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .folder-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .folder-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-count {
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .folder-toggle-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .folder-toggle-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .folder-card.open .folder-toggle-btn svg {
      transform: rotate(180deg);
      color: var(--accent-green);
    }

    /* Submenu (collapsible drawer) */
    .folder-submenu {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s cubic-bezier(0.16, 1, 0.3, 1), padding 0.3s;
      background: var(--bg-subcard);
      border-top: 1px solid transparent;
    }

    .folder-card.open .folder-submenu {
      grid-template-rows: 1fr;
      border-top-color: var(--border-color);
    }

    .submenu-content {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 16px;
      transition: padding 0.3s;
    }

    .folder-card.open .submenu-content {
      padding: 14px 16px 18px;
    }

    /* Diagram Link Button */
    .diagram-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--btn-radius);
      padding: 12px 14px;
      text-decoration: none;
      color: var(--text-primary);
      transition: var(--transition);
    }

    .diagram-btn:hover {
      background: var(--bg-subcard-hover);
      border-color: var(--accent-green);
      transform: translateX(3px);
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    .diagram-btn-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .diagram-btn-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .diagram-btn:hover .diagram-btn-icon {
      background: rgba(0, 255, 136, 0.15);
      color: var(--accent-green);
    }

    .diagram-btn-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .diagram-btn-arrow {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      transition: var(--transition);
    }

    .diagram-btn:hover .diagram-btn-arrow {
      color: var(--accent-green);
      transform: translateX(3px);
    }

    .diagram-btn-arrow svg {
      width: 16px;
      height: 16px;
    }

    /* Empty state / Loading */
    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
      font-size: 15px;
    }

    .status-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Local Manifest Script (Enables direct offline file:/// execution without CORS) -->
  <script src="diagrams.js"></script>
</head>

<body>

  <div class="ambient-glow"></div>

  <div class="container">
    <header>
      <div class="badge-hub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        Diagram Repository
      </div>
      <h1>Notion Diagrams Hub</h1>
      <p class="subtitle">Select a category folder below to view architecture diagrams with interactive sidebars and service breakdowns.</p>
    </header>

    <div class="controls-bar">
      <div class="search-wrapper">
        <input type="text" id="search-input" class="search-input" placeholder="Search categories or diagrams (e.g. AWS, Cloud)..." autocomplete="off">
        <svg viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </div>
    </div>

    <!-- Dynamic Folders Grid -->
    <div id="folders-grid" class="folders-grid">
      <div class="status-msg">
        <div class="status-spinner"></div>
        Discovering diagram paths...
      </div>
    </div>
  </div>

  <script>
    // GitHub repository config for online fallback and automated discovery
    const GITHUB_USER = "Zr1RAM";
    const GITHUB_REPO = "notion-svg-viewer";

    // Known acronyms to format cleanly in uppercase
    const ACRONYMS = new Set(["AWS", "GCP", "AZURE", "API", "DB", "K8S", "CI", "CD", "DNS", "CDN", "IAM", "VPC"]);

    /**
     * Converts a folder slug like "cloud-architecture" to "Cloud Architecture"
     */
    function formatFolderName(slug) {
      if (!slug || slug === "root") return "General Diagrams";
      return slug
        .replace(/[-_]/g, " ")
        .split(" ")
        .map(word => {
          const upper = word.toUpperCase();
          if (ACRONYMS.has(upper)) return upper;
          return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
        })
        .join(" ");
    }

    /**
     * Converts a filename like "aws.html" or "system-design.html" to a clean title like "AWS"
     */
    function formatDiagramTitle(filename) {
      let base = filename.replace(/\.html$/i, "");
      return base
        .replace(/[-_]/g, " ")
        .split(" ")
        .map(word => {
          const upper = word.toUpperCase();
          if (ACRONYMS.has(upper)) return upper;
          return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
        })
        .join(" ");
    }

    /**
     * Parses a list of relative paths and groups them by their parent category folder.
     * Example input: ["cloud-architecture/aws.html", "cloud-architecture/azure.html"]
     */
    function groupPathsByFolder(paths) {
      const folderMap = new Map();

      paths.forEach(rawPath => {
        // Normalize slashes
        const normalized = rawPath.replace(/\\/g, "/").trim();
        if (!normalized.toLowerCase().endsWith(".html") || normalized.toLowerCase() === "index.html") {
          return;
        }

        const segments = normalized.split("/");
        let folderSlug = "general";
        let fileName = "";

        if (segments.length > 1) {
          fileName = segments.pop();
          folderSlug = segments.join("/");
        } else {
          fileName = segments[0];
          folderSlug = "general";
        }

        if (!folderMap.has(folderSlug)) {
          folderMap.set(folderSlug, {
            slug: folderSlug,
            name: formatFolderName(folderSlug),
            diagrams: []
          });
        }

        folderMap.get(folderSlug).diagrams.push({
          title: formatDiagramTitle(fileName),
          fileName: fileName,
          path: normalized
        });
      });

      // Sort diagrams alphabetically inside each folder
      folderMap.forEach(folder => {
        folder.diagrams.sort((a, b) => a.title.localeCompare(b.title));
      });

      return Array.from(folderMap.values());
    }

    /**
     * Renders the folder cards and collapsible submenus
     */
    let currentFolders = [];

    function renderGrid(folders) {
      const gridContainer = document.getElementById("folders-grid");
      const searchQuery = (document.getElementById("search-input").value || "").trim().toLowerCase();

      gridContainer.innerHTML = "";

      // Filter based on search query
      const filteredFolders = folders.map(folder => {
        const folderMatches = folder.name.toLowerCase().includes(searchQuery);
        const matchedDiagrams = folder.diagrams.filter(d => 
          folderMatches || d.title.toLowerCase().includes(searchQuery) || d.fileName.toLowerCase().includes(searchQuery)
        );

        if (matchedDiagrams.length > 0) {
          return {
            ...folder,
            diagrams: matchedDiagrams,
            // Automatically open if search is active
            shouldOpen: searchQuery.length > 0
          };
        }
        return null;
      }).filter(Boolean);

      if (filteredFolders.length === 0) {
        gridContainer.innerHTML = `
          <div class="status-msg">
            No diagrams or folders match "${searchQuery}".
          </div>
        `;
        return;
      }

      filteredFolders.forEach((folder, idx) => {
        const card = document.createElement("div");
        card.className = `folder-card ${folder.shouldOpen || idx === 0 ? "open" : ""}`;
        card.id = `folder-${folder.slug.replace(/[^a-zA-Z0-9]/g, "-")}`;

        card.innerHTML = `
          <div class="folder-header" role="button" tabindex="0" aria-expanded="${folder.shouldOpen || idx === 0}">
            <div class="folder-title-area">
              <div class="folder-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
              </div>
              <div class="folder-info">
                <div class="folder-name">${folder.name}</div>
                <div class="folder-meta">
                  <span class="badge-count">${folder.diagrams.length} ${folder.diagrams.length === 1 ? 'diagram' : 'diagrams'}</span>
                  <span>•</span>
                  <span>/${folder.slug}</span>
                </div>
              </div>
            </div>
            <div class="folder-toggle-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>

          <div class="folder-submenu">
            <div class="submenu-content">
              ${folder.diagrams.map(diagram => `
                <a href="${diagram.path}" class="diagram-btn">
                  <div class="diagram-btn-left">
                    <div class="diagram-btn-icon">${diagram.title.slice(0, 3)}</div>
                    <div class="diagram-btn-title">${diagram.title}</div>
                  </div>
                  <div class="diagram-btn-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                      <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                  </div>
                </a>
              `).join("")}
            </div>
          </div>
        `;

        // Toggle handler
        const header = card.querySelector(".folder-header");
        const toggle = () => {
          const isOpen = card.classList.toggle("open");
          header.setAttribute("aria-expanded", isOpen);
        };

        header.addEventListener("click", toggle);
        header.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });

        gridContainer.appendChild(card);
      });
    }

    /**
     * Dynamically discovers paths from local manifest (diagrams.js/diagrams.json)
     * and GitHub tree API when available.
     */
    async function loadDiagramPaths() {
      const pathsSet = new Set();

      // 1. Read from window.DIAGRAM_PATHS (loaded instantly from diagrams.js with ZERO CORS issues locally)
      if (Array.isArray(window.DIAGRAM_PATHS) && window.DIAGRAM_PATHS.length > 0) {
        window.DIAGRAM_PATHS.forEach(p => pathsSet.add(p));
      }

      // 2. Try fetching diagrams.json if running on a local web server (http/https)
      if (window.location.protocol.startsWith("http")) {
        try {
          const resp = await fetch("diagrams.json");
          if (resp.ok) {
            const jsonPaths = await resp.json();
            if (Array.isArray(jsonPaths)) {
              jsonPaths.forEach(p => pathsSet.add(p));
            }
          }
        } catch (e) {
          // Fall through to GitHub API
        }
      }

      // Initial render with all discovered paths so far
      if (pathsSet.size > 0) {
        currentFolders = groupPathsByFolder(Array.from(pathsSet));
        renderGrid(currentFolders);
      }

      // 3. Online dynamic discovery via GitHub Recursive Tree API
      // Automatically finds any new folders or .html files pushed to the repo
      try {
        const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/main?recursive=1`;
        const res = await fetch(apiUrl);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data.tree)) {
            let foundNew = false;
            data.tree.forEach(item => {
              if (item.type === "blob" && item.path.endsWith(".html") && item.path !== "index.html") {
                if (!pathsSet.has(item.path)) {
                  pathsSet.add(item.path);
                  foundNew = true;
                }
              }
            });

            if (foundNew || currentFolders.length === 0) {
              currentFolders = groupPathsByFolder(Array.from(pathsSet));
              renderGrid(currentFolders);
            }
          }
        }
      } catch (err) {
        // Offline / network failure handled gracefully
      }

      // Fallback if completely empty
      if (pathsSet.size === 0) {
        document.getElementById("folders-grid").innerHTML = `
          <div class="status-msg">
            No diagram paths detected.<br>
            Please check that <code>diagrams.js</code> exists or diagram HTML files are placed in subfolders.
          </div>
        `;
      }
    }

    // Attach search input listener
    document.getElementById("search-input").addEventListener("input", () => {
      renderGrid(currentFolders);
    });

    // Start discovery
    loadDiagramPaths();
  </script>

</body>
</html>
