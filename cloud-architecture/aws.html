i" font-size="9.090909090909099px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="64.82727272727278" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="9.090909090909099px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- **Best for:** Version</text><text x="0" y="76.19090909090916" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="9.090909090909099px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">controlling your application</text><text x="0" y="87.55454545454553" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="9.090909090909099px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">builds and securely passing</text><text x="0" y="98.9181818181819" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="9.090909090909099px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">them to your deployment</text><text x="0" y="110.28181818181828" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="9.090909090909099px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">tools.</text><text x="0" y="121.64545454545465" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="9.090909090909099px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- **The Catch:** It’s</text><text x="0" y="133.00909090909104" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="9.090909090909099px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">strictly storage. Pushing an</text><text x="0" y="144.37272727272742" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="9.090909090909099px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">image to ECR does nothing</text><text x="0" y="155.7363636363638" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="9.090909090909099px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">until another service pulls it</text><text x="0" y="167.10000000000016" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="9.090909090909099px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">to run it.</text></g><g transform="translate(1145.1824461836245 1280.5201973329085) rotate(0 71.45019047857875 67.79942728352233)"><text x="0" y="5.6217689822854755" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="6.381122567860926px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- ECS (Elastic Container Service)</text><text x="0" y="13.598172192111633" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="6.381122567860926px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">    </text><text x="0" y="21.574575401937793" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="6.381122567860926px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">    A container orchestrator. If a container</text><text x="0" y="29.550978611763945" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="6.381122567860926px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">crashes, ECS automatically restarts it</text><text x="0" y="37.527381821590104" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="6.381122567860926px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">    </text><text x="0" y="45.503785031416264" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="6.381122567860926px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">    When using ECS, you have to decide</text><text x="0" y="53.480188241242416" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="6.381122567860926px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">**where** the containers actually physically</text><text x="0" y="61.456591451068576" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="6.381122567860926px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">run. You have two options (Launch Types):</text><text x="0" y="69.43299466089474" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="6.381122567860926px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">    </text><text x="0" y="77.4093978707209" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="6.381122567860926px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">    1. **EC2 Launch Type:** ECS puts your</text><text x="0" y="85.38580108054705" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="6.381122567860926px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">containers onto EC2 instances that *you*</text><text x="0" y="93.36220429037321" font-family="Excalifont, Xiaolai, sa
